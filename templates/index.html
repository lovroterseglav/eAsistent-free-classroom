<!doctype html>
<html lang="sl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Poišči proste učilnice iz javnega urnika eAsistent.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
    <title>Proste učilnice</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <script type="module" src="{{ url_for('static', path='app.js') }}"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Proste učilnice</h1>
        <p>Izberi šolo, datum in uro.</p>
      </header>

      <form id="search-form" class="search-form">
        <div class="school-field">
          <span id="school-label" class="field-label">Šola</span>
          <div class="school-row">
            <details id="school-dropdown" class="choice-dropdown" data-disabled>
              <summary aria-labelledby="school-label school-summary">
                <span id="school-summary">Izberi šolo</span>
                <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path d="m4 6 4 4 4-4"></path>
                </svg>
              </summary>
              <div class="choice-panel">
                <label class="visually-hidden" for="school-search">Poišči šolo</label>
                <input id="school-search" class="choice-search" type="search" autocomplete="off" spellcheck="false" placeholder="Poišči šolo …">
                <div id="school-options" class="choice-list" role="radiogroup" aria-labelledby="school-label"></div>
              </div>
            </details>
            <button id="favorite-button" class="favorite-button" type="button" aria-pressed="false"
              aria-label="Nastavi kot privzeto šolo" title="Nastavi kot privzeto šolo" disabled>☆</button>
          </div>
        </div>
        <div>
          <label class="field-label" for="date-input">Datum</label>
          <div class="date-control">
            <input id="date-input" name="date" type="text" inputmode="numeric" autocomplete="off"
              placeholder="DD/MM/YYYY" aria-describedby="date-format" disabled required>
            <button id="date-picker-button" class="date-picker-button" type="button" aria-label="Odpri koledar" title="Odpri koledar" disabled>
              <svg class="calendar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M7 3v3M17 3v3M4.5 9.5h15M6 5h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"></path>
              </svg>
            </button>
            <input id="date-picker" class="visually-hidden" type="date" tabindex="-1" aria-hidden="true" disabled>
          </div>
          <small id="date-format" class="visually-hidden">Oblika datuma: DD/MM/YYYY</small>
        </div>
        <div class="period-field">
          <span id="period-label" class="field-label">Šolska ura</span>
          <details id="period-dropdown" class="choice-dropdown" data-disabled>
            <summary aria-labelledby="period-label period-summary">
              <span id="period-summary">Nalaganje …</span>
              <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path d="m4 6 4 4 4-4"></path>
              </svg>
            </summary>
            <div class="choice-panel compact-panel">
              <div id="period-options" class="choice-list" role="radiogroup" aria-labelledby="period-label"></div>
            </div>
          </details>
        </div>
        <div class="actions">
          <button id="search-button" class="primary-button" type="submit" disabled>Poišči</button>
        </div>
      </form>

      <details class="add-school">
        <summary>Dodaj šolo</summary>
        <form id="add-school-form" class="url-form">
          <label for="school-url">Povezava do javnega urnika</label>
          <div class="url-row">
            <input id="school-url" name="url" type="url" inputmode="url" autocomplete="url" placeholder="https://urniki.easistent.com/urniki/…" required>
            <button class="secondary-button" type="submit">Dodaj</button>
          </div>
        </form>
      </details>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <section id="results-section" class="results" aria-labelledby="results-heading" hidden>
        <div class="results-title">
          <h2 id="results-heading">Proste učilnice</h2>
          <div id="result-meta"></div>
        </div>
        <div id="free-summary" class="free-summary"></div>
        <div id="room-list" class="room-list"></div>
        <details id="unknown-section" class="unknown-section" hidden>
          <summary id="unknown-summary">Ni bilo mogoče preveriti</summary>
          <ul id="unknown-list"></ul>
        </details>
      </section>

      <a id="source-link" class="source-link" href="https://urniki.easistent.com" target="_blank" rel="noreferrer">Izvorni urnik</a>
    </main>
  </body>
</html>
